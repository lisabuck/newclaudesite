name: Fetch award badge images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the award badge PNGs for identification
        run: |
          mkdir -p diagnostics/badges
          for id in \
            b2375c_9a5de73ba7274435bef2b5b87eb9215b \
            b2375c_255564a965944c63978ac2372dbf2c3b \
            b2375c_f0613e5ddc6a4800b1ceb4282a0d8f73 \
            b2375c_7427a4e688c24769bb8bc738412a9286 \
            b2375c_f57bb793acdf41559a700e61c1de773c \
            b2375c_dbcdade7477649ea82cd56d37965ae2f \
            b2375c_5f45418dea224e1d80516fde55aa08ae \
            b2375c_f3dfa54d68d04fa98398b57fdd573814 \
            b2375c_8c215b863e694f2a832ffd50cd384511 \
            b2375c_929ff58dd3614768bd20120438f2a98f \
            b2375c_379b071af8aa4e88844ee2ce40fc4160 \
            b2375c_6bb4af92e808403cb14a75786ef7a666 \
            b2375c_b7ba30246bb24730a625aea3d121f2db \
            b2375c_e26eed5aebcf455c9f6344b3c4fd11fb \
            b2375c_b5ca193103e348f6b4ee30d9f9b283da \
            b2375c_4c0c6e06bfc640659d61a11423418bf7 \
            b0568f_23f5a306c21c4ed8a309b057810d33bb \
            b0568f_8eeb2aed94c34284b6f21d6ed42c1d07 \
            b0568f_3d32fb404e3d4c14919db81b621207cd; do
            short=$(echo "$id" | cut -c1-16)
            curl -sSL --max-time 60 -o "diagnostics/badges/${short}.png" \
              "https://static.wixstatic.com/media/${id}~mv2.png/v1/fit/w_400,h_400,q_90,enc_auto/${id}~mv2.png" || echo "FAILED $id"
          done
          ls -la diagnostics/badges/
          git config user.name "Claude" && git config user.email "noreply@anthropic.com"
          git checkout -B diag-badges
          git add diagnostics/badges
          git commit -m "Diagnostic copies of the award badge images"
          git push -f origin diag-badges
