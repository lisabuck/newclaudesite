name: Probe testimonial video renditions
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HEAD check
        run: |
          for u in "https://static.wixstatic.com/media/b2375c_6ec394db6cdf402c8fe6b4cd8ca23e57~mv2.jpg/v1/fit/w_1920,h_1200,q_85,enc_auto/slide.jpg" "https://static.wixstatic.com/media/b2375c_6ec394db6cdf402c8fe6b4cd8ca23e57~mv2.jpg"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")
            echo "RESULT ${code} $u"
          done
